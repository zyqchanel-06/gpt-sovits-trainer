name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单测 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: pip install PyYAML

      - name: 编译检查
        run: python -m compileall -q sovits_trainer

      - name: 单元测试（dry-run，不需要显卡）
        run: python -m unittest discover -s tests -v

      - name: CLI 帮助可用
        run: python -m sovits_trainer --help
